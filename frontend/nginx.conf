server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy ALL API routes to the backend.
    # This matches both "/medicines" and "/medicines/..." so nginx never issues its own
    # 301 slash-redirect (which was causing an endless redirect loop with FastAPI's 307).
    # No URI is given in proxy_pass, so the original path and query string pass through unchanged.
    location ~ ^/(auth|medicines|customers|sales|suppliers|purchases|inventory|notifications|forecasts|users|credit|financial|reports)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # SPA routing (everything else)
    location / {
        try_files $uri $uri/ /index.html;
    }
}